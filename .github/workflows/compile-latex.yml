name: Compile LaTeX

on:
  push:
    branches:
      - main
    paths:
      - 'seminar/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: seminar/
          latexmk_use_lualatex: false
          # IEEEtran usually works with pdflatex or latexmk.
          # The main.tex says % !TeX program = latexmk

      - name: Push PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seminar/main.pdf
          git commit -m "Update compiled seminar PDF [skip ci]" || echo "No changes to commit"
          git push
