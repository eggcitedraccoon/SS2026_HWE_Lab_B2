# ────────────────────────────────────────────────────────────────────────────
#  VHDL CI  —  compiles and simulates all .vhd files under labs/
#
#  Triggers : every push and every pull-request on any branch
#  Toolchain: GHDL (open-source, LLVM/mcode backend via apt)
#  Results  : TEST_RESULTS.md is auto-committed back to the branch after
#             every push so the table stays current in the repo.
# ────────────────────────────────────────────────────────────────────────────

name: VHDL Compile & Simulate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  vhdl-ci:
    name: Compile & Simulate
    runs-on: ubuntu-latest

    # 'contents: write' is required so the job can commit TEST_RESULTS.md
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch the full history so the auto-commit action can push cleanly
          fetch-depth: 0

      # ── 2. Install GHDL ────────────────────────────────────────────────────
      - name: Install GHDL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ghdl
          ghdl --version

      # ── 3. Run CI script ───────────────────────────────────────────────────
      #    'if: always()' on later steps ensures we still get results even
      #    when compilation fails.
      - name: Run VHDL analysis and simulation
        id: vhdl_ci
        run: python3 scripts/vhdl_ci.py

      # ── 4. Upload TEST_RESULTS.md as a workflow artifact ───────────────────
      #    Always runs so the file is downloadable even on failure.
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vhdl-test-results
          path: TEST_RESULTS.md
          if-no-files-found: warn

      # ── 5. Write results to the GitHub Actions job summary ─────────────────
      #    Shows the table directly in the Actions run UI.
      - name: Publish results to job summary
        if: always()
        run: |
          if [ -f TEST_RESULTS.md ]; then
            cat TEST_RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── 6. Commit TEST_RESULTS.md back to the branch ───────────────────────
      #    Only on push events (not PRs — we can't push to forks).
      #    [skip ci] in the commit message prevents an infinite loop.
      - name: Commit TEST_RESULTS.md
        if: always() && github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update VHDL test results [skip ci]"
          file_pattern: TEST_RESULTS.md
          commit_user_name:  "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"